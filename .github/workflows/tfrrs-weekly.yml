# Monday TFRRS results refresh (Ryan 2026-10-13: Mondays only).
# Scrapes the current season politely (3 s per page), builds the results files and force-pushes them to the `data` branch
# (one commit, replaced weekly, so the repo doesn't grow). The site reads the newest season from that branch.
# Runs in PreferredRecruit/track-standards only (the repo Vercel deploys); afterwards it triggers a Vercel rebuild so the
# pre-built pages (season bests, champions, top marks) refresh too. Set the repo secret VERCEL_DEPLOY_HOOK to the
# project's deploy hook URL (Vercel > track-standards > Settings > Git > Deploy Hooks).
name: TFRRS weekly refresh
on:
  schedule:
    - cron: "0 10 * * 1"   # Mondays 10:00 UTC (6 AM Eastern)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: tfrrs-weekly
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'PreferredRecruit/track-standards'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape TFRRS and build this season's results
        run: python3 scripts/tfrrs/weekly.py
      - name: Publish to the data branch
        run: |
          cd scripts/tfrrs/out
          git init -q -b data
          git config user.name "tfrrs-weekly"
          git config user.email "tfrrs-weekly@users.noreply.github.com"
          git add -A
          git commit -q -m "Weekly TFRRS results $(date -u +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data:data
      - name: Rebuild the site on Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" > /dev/null && echo "rebuild triggered"; else echo "VERCEL_DEPLOY_HOOK not set, skipping rebuild"; fi
      - name: Tell Bing and other IndexNow engines which pages changed
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          [ -n "$HOOK" ] || { echo "no rebuild this run, skipping IndexNow"; exit 0; }
          sleep 300   # let the Vercel rebuild finish first
          python3 - <<'PY'
          # IndexNow (Bing, Yandex, Seznam, Naver; Bing feeds ChatGPT search, Copilot and DuckDuckGo). The key is public by
          # design: https://trackandfieldstandards.com/9fca9ca5284c2ff286008601e0e776fd.txt. Sends only URLs whose sitemap lastmod is the newest date.
          import json, re, urllib.request
          host, key = "trackandfieldstandards.com", "9fca9ca5284c2ff286008601e0e776fd"
          rows = []
          for k in ("schools", "results", "standards", "guides"):
              x = urllib.request.urlopen(f"https://{host}/sitemap-{k}.xml", timeout=30).read().decode()
              rows += re.findall(r"<loc>([^<]+)</loc><lastmod>([^<]+)</lastmod>", x)
          newest = max(d for _, d in rows)
          urls = [u for u, d in rows if d == newest][:10000]
          body = json.dumps({"host": host, "key": key, "keyLocation": f"https://{host}/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
          print("IndexNow:", urllib.request.urlopen(req, timeout=60).status, len(urls), "URLs dated", newest)
          PY
